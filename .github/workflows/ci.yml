name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pruebas y build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The runner image ships several Xcodes; take the newest so we always
      # build against the latest iOS SDK available.
      - name: Elegir el Xcode más nuevo
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Usando $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Instalar xcodegen
        run: brew install xcodegen

      - name: Pruebas de CentavoCore
        run: swift test
        working-directory: Packages/CentavoCore

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Build de la app
        run: |
          xcodebuild -project Centavo.xcodeproj -scheme Centavo \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO -jobs 4 build

      # Lo que no se ve en el build: que la tipografía, el ícono y el modo oscuro
      # de verdad viajen dentro de la app.
      - name: Comprobar el contenido de la app
        run: |
          app="$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'Centavo.app' -path '*Build/Products*' | head -1)"
          test -n "$app" || { echo "No encontré Centavo.app"; exit 1; }
          echo "App: $app"
          for f in IBMPlexMono-Regular.ttf IBMPlexMono-Medium.ttf IBMPlexMono-SemiBold.ttf Assets.car PrivacyInfo.xcprivacy; do
            test -f "$app/$f" && echo "ok  $f" || { echo "FALTA $f"; exit 1; }
          done
          plutil -p "$app/Info.plist" | grep -E 'UIUserInterfaceStyle|CFBundleIconName|CFBundleDevelopmentRegion'
          plutil -p "$app/Info.plist" | grep -q '"CFBundleDevelopmentRegion" => "es"' || { echo "Falta declarar el español"; exit 1; }
          plutil -p "$app/Info.plist" | grep -q '"UIUserInterfaceStyle" => "Dark"' || { echo "Falta el modo oscuro"; exit 1; }
          plutil -p "$app/Info.plist" | grep -E 'ITSAppUsesNonExemptEncryption|LSApplicationCategoryType'
          plutil -p "$app/Info.plist" | grep -q 'ITSAppUsesNonExemptEncryption' || { echo "Falta la declaración de cifrado"; exit 1; }
          plutil -p "$app/PrivacyInfo.xcprivacy" | grep -q 'CA92.1' || { echo "Falta el motivo de UserDefaults"; exit 1; }

  # Corre la app en el simulador y le toma una captura a cada pantalla, para poder
  # revisar el diseño sin una Mac a la mano. No bloquea el PR: es para ver, no para aprobar.
  interfaz:
    name: Capturas en simulador
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Elegir el Xcode más nuevo
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Instalar xcodegen
        run: brew install xcodegen

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Elegir el simulador
        id: sim
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          best = None
          for runtime in sorted(devices):
              if 'iOS' not in runtime: continue
              for d in devices[runtime]:
                  if d['name'].startswith('iPhone') and d.get('isAvailable', True):
                      if best is None or d['name'] == 'iPhone 16 Pro' or 'Pro' not in best[0]:
                          best = (d['name'], d['udid'], runtime)
          print(best[1])
          ")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | head -40

      # In a PR only what decides the merge runs: flows, the tap-target audit and the unit
      # tests. The screenshots and the accessibility audits that only report are for looking,
      # not approving, so they run on main. (Two simulators in parallel were tried: on these
      # small runners the second one dropped out and nothing was gained.)
      - name: Correr las pruebas de interfaz
        run: |
          skip=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            skip="-skip-testing:CentavoUITests/ScreenshotTests"
            for t in testAuditarPrincipal testAuditarCalendario testAuditarPrimeraVez \
                     testAuditarHojaDeGasto testAuditarGuia testAuditarLetraGrande; do
              skip="$skip -skip-testing:CentavoUITests/AccessibilityAuditTests/$t"
            done
          fi
          xcodebuild test -project Centavo.xcodeproj -scheme Centavo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            $skip \
            -resultBundlePath build/result.xcresult \
            CODE_SIGNING_ALLOWED=NO -jobs 4

      - name: Exportar las capturas
        if: always()
        run: |
          mkdir -p build/capturas
          xcrun xcresulttool export attachments --path build/result.xcresult --output-path build/capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: build/capturas
          retention-days: 14
