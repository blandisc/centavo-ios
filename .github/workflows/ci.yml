name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pruebas y build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The runner image ships several Xcodes; take the newest so we always
      # build against the latest iOS SDK available.
      - name: Elegir el Xcode más nuevo
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Usando $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Instalar xcodegen
        run: brew install xcodegen

      - name: Pruebas de CentavoCore
        run: swift test
        working-directory: Packages/CentavoCore

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Build de la app
        run: |
          xcodebuild -project Centavo.xcodeproj -scheme Centavo \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO -jobs 4 build

      # Lo que no se ve en el build: que la tipografía, el ícono y el modo oscuro
      # de verdad viajen dentro de la app.
      - name: Comprobar el contenido de la app
        run: |
          app="$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'Centavo.app' -path '*Build/Products*' | head -1)"
          test -n "$app" || { echo "No encontré Centavo.app"; exit 1; }
          echo "App: $app"
          for f in IBMPlexMono-Regular.ttf IBMPlexMono-Medium.ttf IBMPlexMono-SemiBold.ttf Assets.car; do
            test -f "$app/$f" && echo "ok  $f" || { echo "FALTA $f"; exit 1; }
          done
          plutil -p "$app/Info.plist" | grep -E 'UIUserInterfaceStyle|CFBundleIconName'
          plutil -p "$app/Info.plist" | grep -q '"UIUserInterfaceStyle" => "Dark"' || { echo "Falta el modo oscuro"; exit 1; }
