name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dispositivos:
        description: "También las capturas en iPhone SE, 13 mini, 17 Pro y 17 Pro Max"
        type: boolean
        default: false
      ingles:
        description: "También las capturas en inglés (EnglishScreenshotTests)"
        type: boolean
        default: false
      guia:
        description: "Solo rehacer las capturas de Atajos de la guía, en este idioma (GuideScreenshotsTests)"
        type: choice
        options: [none, es, en]
        default: none

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

jobs:
  verify:
    name: Pruebas y build
    runs-on: macos-latest
    # A newer push makes this one pointless: cancel it.
    concurrency:
      group: ci-verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      # The runner image ships several Xcodes; take the newest so we always
      # build against the latest iOS SDK available.
      - name: Elegir el Xcode más nuevo
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Usando $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      # Fails when a screen writes a raw number, font size or color instead of a token
      # (docs/DESIGN_SYSTEM.md). First, because it takes a second.
      - name: Lint del sistema de diseño
        run: Tools/lint-design.sh

      # The pinned release binary instead of `brew install`: seconds instead of minutes.
      - name: Instalar xcodegen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Pruebas de CentavoCore
        run: swift test
        working-directory: Packages/CentavoCore

      - name: Generar el proyecto
        run: xcodegen generate

      # Release: the app as a person gets it. Debug is what the Mac builds all day; nothing else
      # would notice a symbol that only exists under `#if DEBUG`, or how much the app weighs.
      - name: Build de la app (Release)
        run: |
          xcodebuild -project Centavo.xcodeproj -scheme Centavo -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO -jobs 4 build

      # Every text the build extracted has its English in the catalogs (2026-11-18,
      # docs/DECISIONS.md): a new Spanish sentence without one fails here.
      - name: Textos en inglés
        run: python3 Tools/check-l10n.py build/dd

      # Lo que no se ve en el build: que la tipografía, el ícono y el modo oscuro
      # de verdad viajen dentro de la app.
      - name: Comprobar el contenido de la app
        run: |
          app="build/dd/Build/Products/Release-iphoneos/Centavo.app"
          test -d "$app" || { echo "No encontré Centavo.app"; exit 1; }
          echo "Peso de la app (Release, sin firmar):"
          du -sh "$app" "$app/Centavo" "$app/PlugIns/CentavoWidgets.appex" "$app/Assets.car"
          for f in IBMPlexMono-Regular.ttf IBMPlexMono-Medium.ttf IBMPlexMono-SemiBold.ttf Assets.car PrivacyInfo.xcprivacy; do
            test -f "$app/$f" && echo "ok  $f" || { echo "FALTA $f"; exit 1; }
          done
          plutil -p "$app/Info.plist" | grep -E 'UIUserInterfaceStyle|CFBundleIconName|CFBundleDevelopmentRegion'
          plutil -p "$app/Info.plist" | grep -q '"CFBundleDevelopmentRegion" => "es"' || { echo "Falta declarar el español"; exit 1; }
          plutil -p "$app/Info.plist" | grep -q '"UIUserInterfaceStyle" => "Dark"' || { echo "Falta el modo oscuro"; exit 1; }
          plutil -p "$app/Info.plist" | grep -E 'ITSAppUsesNonExemptEncryption|LSApplicationCategoryType'
          plutil -p "$app/Info.plist" | grep -q 'ITSAppUsesNonExemptEncryption' || { echo "Falta la declaración de cifrado"; exit 1; }
          plutil -p "$app/PrivacyInfo.xcprivacy" | grep -q 'CA92.1' || { echo "Falta el motivo de UserDefaults"; exit 1; }

  # Saving, capture, fixed expenses and the backup (CentavoTests): seconds of tests that need a
  # simulator to run. Their own job, so their answer doesn't wait for the interface suite.
  datos:
    name: Pruebas de datos
    runs-on: macos-latest
    concurrency:
      group: ci-datos-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - name: Elegir el Xcode más nuevo
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Instalar xcodegen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Elegir el simulador
        id: sim
        run: echo "udid=$(Tools/ci-simulador.sh)" >> "$GITHUB_OUTPUT"

      - name: Correr las pruebas de datos
        run: |
          xcodebuild test -project Centavo.xcodeproj -scheme Centavo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:CentavoTests \
            CODE_SIGNING_ALLOWED=NO -jobs 4

  # Corre la app en el simulador y le toma una captura a cada pantalla, para poder
  # revisar el diseño sin una Mac a la mano. No bloquea el PR: es para ver, no para aprobar.
  # The simulator (flows, tap targets, screenshots) takes most of an hour in one piece, so it
  # runs in two machines at once (the flows, and the rest) on every push to main and by hand
  # (owner's decision of 2026-10-20). A run in progress is never cancelled by a newer push: the
  # newer one waits its turn, so there is a whole result to look at every time.
  interfaz:
    name: Simulador · ${{ matrix.parte.nombre }}
    # A run by hand for the guide's pictures only («guia») skips the two long machines.
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.guia == 'none' || inputs.guia == '')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        parte:
          - nombre: capturas
            artefacto: capturas
            pruebas: "-skip-testing:CentavoUITests/FlowTests -skip-testing:CentavoTests"
          - nombre: flujos
            artefacto: capturas-flujos
            pruebas: "-only-testing:CentavoUITests/FlowTests"
    concurrency:
      group: ci-interfaz-${{ matrix.parte.nombre }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Elegir el Xcode más nuevo
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # The pinned release binary instead of `brew install`: seconds instead of minutes.
      - name: Instalar xcodegen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Elegir el simulador
        id: sim
        run: echo "udid=$(Tools/ci-simulador.sh)" >> "$GITHUB_OUTPUT"

      # Flows, audits, screenshots and the 5,000-expense timing, between the two machines.
      # (Two simulators on one runner were tried: on these small runners the second one
      # dropped out and nothing was gained.)
      # A failed test gets one more try: on these runners the simulator sometimes stops
      # answering mid-test («App event loop idle notification not received»), and before
      # every test after it failed too (2026-11-16, 40 failures from one hang). Failing
      # twice still fails the job.
      - name: Correr las pruebas de interfaz
        run: |
          xcodebuild test -project Centavo.xcodeproj -scheme Centavo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            ${{ matrix.parte.pruebas }} \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath build/result.xcresult \
            CODE_SIGNING_ALLOWED=NO -jobs 4

      - name: Exportar las capturas
        if: always()
        run: |
          mkdir -p build/capturas
          xcrun xcresulttool export attachments --path build/result.xcresult --output-path build/capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.parte.artefacto }}
          path: build/capturas
          retention-days: 14

  # Las capturas en varios iPhones a la vez, del más chico al más grande (2026-11-18, pasada
  # antes del lanzamiento). Solo a mano, con «dispositivos»: son cuatro máquinas de casi una hora.
  dispositivos:
    name: Dispositivos · ${{ matrix.iphone }}
    if: github.event_name == 'workflow_dispatch' && inputs.dispositivos
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        iphone:
          - "iPhone SE (3rd generation)"
          - "iPhone 13 mini"
          - "iPhone 17 Pro"
          - "iPhone 17 Pro Max"
    steps:
      - uses: actions/checkout@v5

      - name: Elegir el Xcode más nuevo
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Instalar xcodegen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Elegir el simulador
        id: sim
        env:
          CENTAVO_SIM_NAME: ${{ matrix.iphone }}
        run: echo "udid=$(Tools/ci-simulador.sh)" >> "$GITHUB_OUTPUT"

      - name: Correr las pruebas
        run: |
          xcodebuild test -project Centavo.xcodeproj -scheme Centavo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:CentavoUITests/ScreenshotTests -only-testing:CentavoUITests/FlowTests/testSinMiDineroNoHayPestanas \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath build/result.xcresult \
            CODE_SIGNING_ALLOWED=NO -jobs 4

      - name: Exportar las capturas
        if: always()
        run: |
          mkdir -p build/capturas
          xcrun xcresulttool export attachments --path build/result.xcresult --output-path build/capturas

      - name: Nombre del artefacto
        if: always()
        id: nombre
        run: echo "valor=capturas-$(echo '${{ matrix.iphone }}' | tr -c 'A-Za-z0-9' '-' | tr -s '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.nombre.outputs.valor }}
          path: build/capturas
          retention-days: 14

  # La app en inglés, pantalla por pantalla (2026-11-18): las mismas pantallas que las capturas,
  # con el iPhone en inglés. Solo a mano, con «ingles».
  ingles:
    name: Capturas en inglés
    if: github.event_name == 'workflow_dispatch' && inputs.ingles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Elegir el Xcode más nuevo
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Instalar xcodegen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Elegir el simulador
        id: sim
        run: echo "udid=$(Tools/ci-simulador.sh)" >> "$GITHUB_OUTPUT"

      - name: Correr las capturas en inglés
        run: |
          xcodebuild test -project Centavo.xcodeproj -scheme Centavo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:CentavoUITests/EnglishScreenshotTests \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath build/result.xcresult \
            CODE_SIGNING_ALLOWED=NO -jobs 4

      - name: Exportar las capturas
        if: always()
        run: |
          mkdir -p build/capturas
          xcrun xcresulttool export attachments --path build/result.xcresult --output-path build/capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-ingles
          path: build/capturas
          retention-days: 14

  # Las capturas de Atajos de la guía de Wallet (DECISIONS 2026-10-19): GuideScreenshotsTests
  # recorre Atajos de verdad en un simulador recién borrado, oscuro y en el idioma pedido, y
  # Tools/guia-aros.py les dibuja el aro y arma los imagesets (`imagesets/` dentro del artefacto,
  # listos para copiar a Assets.xcassets). Solo a mano, con «guia» = es o en. Sin reintentos:
  # la segunda vuelta encontraría la automatización ya hecha. Si falta una etiqueta, el
  # artefacto trae «falta-…» y su «-arbol», que dice cómo se llama en esa versión de Atajos.
  guia:
    name: Guía de Atajos · ${{ inputs.guia }}
    if: github.event_name == 'workflow_dispatch' && inputs.guia != 'none' && inputs.guia != ''
    runs-on: macos-latest
    timeout-minutes: 60
    # A tool to retake pictures, not a check of the app: a step Apple renamed in Atajos must not
    # fail the run and send the owner an email (2026-11-19). Its result is read in the artifact.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Elegir el Xcode más nuevo
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Instalar xcodegen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generar el proyecto
        run: xcodegen generate

      # Recién borrado, como alguien que acaba de estrenar el iPhone: sin «Novedades» vistas
      # ni atajos de otra corrida. Oscuro y con el iPhone entero en el idioma (el teclado y sus
      # avisos son del sistema, no de Atajos).
      - name: Preparar un simulador recién borrado
        id: sim
        env:
          IDIOMA: ${{ inputs.guia }}
        run: |
          udid="$(Tools/ci-simulador.sh)"
          xcrun simctl shutdown "$udid" || true
          xcrun simctl erase "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          if [ "$IDIOMA" = en ]; then lang=en-US; locale=en_US; else lang=es-MX; locale=es_MX; fi
          xcrun simctl spawn "$udid" defaults write "Apple Global Domain" AppleLanguages -array "$lang"
          xcrun simctl spawn "$udid" defaults write "Apple Global Domain" AppleLocale -string "$locale"
          xcrun simctl shutdown "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Recorrer Atajos
        env:
          TEST_RUNNER_CENTAVO_GUIA: "1"
          TEST_RUNNER_CENTAVO_GUIA_IDIOMA: ${{ inputs.guia }}
        run: |
          xcodebuild test -project Centavo.xcodeproj -scheme Centavo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:CentavoUITests/GuideScreenshotsTests \
            -resultBundlePath build/result.xcresult \
            CODE_SIGNING_ALLOWED=NO -jobs 4

      - name: Exportar las capturas
        if: always()
        run: |
          mkdir -p build/capturas
          xcrun xcresulttool export attachments --path build/result.xcresult --output-path build/capturas

      # With part of the walk done the pictures it got are still worth having.
      - name: Dibujar los aros y armar los imagesets
        if: always()
        run: python3 Tools/guia-aros.py build/capturas "${{ inputs.guia }}" --salida build/capturas/imagesets

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guia-atajos-${{ inputs.guia }}
          path: build/capturas
          retention-days: 14
