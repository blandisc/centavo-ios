name: Centavo
options:
  bundleIdPrefix: com.blandisc
  developmentLanguage: es
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  CentavoCore:
    path: Packages/CentavoCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Centavo:
    type: application
    platform: iOS
    sources: [Centavo]
    dependencies:
      - package: CentavoCore
    scheme:
      testTargets: [CentavoTests, CentavoUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blandisc.centavo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Centavo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  CentavoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CentavoUITests]
    dependencies:
      - target: Centavo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blandisc.centavo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Centavo
  CentavoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CentavoTests]
    dependencies:
      - target: Centavo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blandisc.centavo.tests
        GENERATE_INFOPLIST_FILE: YES
