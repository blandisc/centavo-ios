name: Centavo
options:
  bundleIdPrefix: com.blandisc
  developmentLanguage: es
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  CentavoCore:
    path: Packages/CentavoCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    # The build number and the commit shown in «Ajustes» come in as build settings
    # (`Tools/instalar.sh` passes the real ones). They used to be written into the built
    # Info.plist by a script after the build: its place among Xcode's steps was left to chance,
    # so the stamp was sometimes lost and once broke the widget's signature (2026-11-12).
    CURRENT_PROJECT_VERSION: "1"
    CENTAVO_COMMIT: "local"
    # Drops code nothing calls from the binary.
    DEAD_CODE_STRIPPING: YES
    # The CI's Xcode is older and slower at type-checking than the Mac's: a long chain of
    # modifiers that builds here can fail there («unable to type-check this expression in
    # reasonable time»). Any expression over 300 ms is warned about, and `Tools/verify.sh` fails
    # on that warning, so it is split before it is pushed.
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-expression-type-checking=300"
targets:
  Centavo:
    type: application
    platform: iOS
    sources:
      - path: Centavo
        excludes: [Info.plist]
    dependencies:
      - package: CentavoCore
      - target: CentavoWidgets
    scheme:
      testTargets: [CentavoTests, CentavoUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blandisc.centavo
        # iCloud sync and the App Group shared with the widgets. A free developer account
        # cannot sign iCloud, and xcodebuild gives it profiles without the App Group: build with
        # CODE_SIGN_ENTITLEMENTS=Centavo/CentavoGratis.entitlements (for both targets: only the
        # shared Keychain group) and the app keeps everything on the phone only.
        CODE_SIGN_ENTITLEMENTS: Centavo/Centavo.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Al día"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Para proteger «Mi dinero» y mostrarte la contraseña del respaldo."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Para guardar dónde pagaste cada gasto, como lo muestra Wallet. Solo si enciendes «Guardar dónde pagas»."
        # Merged with the generated keys: only the launch screen lives there.
        INFOPLIST_FILE: Centavo/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  CentavoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CentavoWidgets
        excludes: [Info.plist, "*.entitlements"]
      # The look and the money format are the app's own, shared file by file.
      - path: Centavo/Theme
      - path: Centavo/Resources/Fonts
        buildPhase: resources
      # The «+» of the small widget and the «Anotar gasto» control run it; the system runs it
      # in the app, so it lives in both targets.
      - path: Centavo/Intents/OpenAddExpenseIntent.swift
    dependencies:
      - package: CentavoCore
    # The same build number as the app.
    info:
      path: CentavoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Al día
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CentavoCommit: $(CENTAVO_COMMIT)
        CentavoKeychainGroup: $(AppIdentifierPrefix)com.blandisc.centavo.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blandisc.centavo.widgets
        # The App Group and the shared Keychain group (the fallback a free account can sign).
        CODE_SIGN_ENTITLEMENTS: CentavoWidgets/CentavoWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  CentavoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CentavoUITests]
    dependencies:
      - target: Centavo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blandisc.centavo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Centavo
  CentavoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CentavoTests]
    dependencies:
      - target: Centavo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blandisc.centavo.tests
        GENERATE_INFOPLIST_FILE: YES
